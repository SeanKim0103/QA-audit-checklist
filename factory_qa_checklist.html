<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>사료 제조 공장 현장 위생·공정 품질(QA) 점검표</title>
  <style>
    :root {
      --navy-900: #0b1f3a;
      --navy-800: #122d52;
      --navy-700: #1b4072;
      --navy-100: #e8eef6;
      --navy-50: #f3f6fa;

      --bg-page: #f0f4f8;
      --bg-card: #ffffff;
      --border-color: #d7e0ea;
      --text-main: #182433;
      --text-muted: #5b6b7f;

      --pass-color: #15803d;
      --pass-bg: #dcfce7;
      --pass-border: #86efac;

      --fail-color: #b91c1c;
      --fail-bg: #fee2e2;
      --fail-border: #fca5a5;

      --na-color: #475569;
      --na-bg: #e2e8f0;
      --na-border: #cbd5e1;

      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 8px;
      --shadow-sm: 0 2px 6px rgba(11, 31, 58, 0.06);
      --shadow-md: 0 6px 18px rgba(11, 31, 58, 0.1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 92px;
    }

    /* Header */
    .app-header {
      background: linear-gradient(135deg, var(--navy-900), var(--navy-800));
      color: #ffffff;
      padding: 18px 16px 16px;
      box-shadow: var(--shadow-md);
    }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-title {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-subtitle {
      margin: 2px 0 0;
      font-size: 0.8rem;
      color: #cbd5e1;
    }

    .save-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      background: rgba(255, 255, 255, 0.12);
      padding: 6px 10px;
      border-radius: 999px;
      color: #e2e8f0;
    }

    .save-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
    }

    /* Main Container */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Sticky Dashboard */
    .dashboard-sticky {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(240, 244, 248, 0.94);
      backdrop-filter: blur(8px);
      padding: 10px 0 6px;
      margin-bottom: 10px;
    }

    .dashboard-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      box-shadow: var(--shadow-sm);
    }

    .dash-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      align-items: center;
    }

    .dash-metric {
      display: flex;
      flex-direction: column;
    }

    .dash-label {
      font-size: 0.76rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .dash-value {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--navy-900);
      line-height: 1.25;
    }

    .dash-value.pass-rate-good {
      color: var(--pass-color);
    }

    .dash-value.pass-rate-warn {
      color: #d97706;
    }

    .dash-value.pass-rate-bad {
      color: var(--fail-color);
    }

    .dash-counts {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
      font-size: 0.76rem;
      font-weight: 700;
    }

    .count-pill {
      padding: 4px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .count-pill.pass { background: var(--pass-bg); color: var(--pass-color); }
    .count-pill.fail { background: var(--fail-bg); color: var(--fail-color); }
    .count-pill.na { background: var(--na-bg); color: var(--na-color); }

    .progress-track {
      margin-top: 10px;
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--navy-700), #16a34a);
      border-radius: 999px;
      transition: width 0.25s ease;
    }

    /* Card Section */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 18px 16px;
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }

    .section-title {
      margin: 0 0 14px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--navy-900);
      display: flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--navy-100);
    }

    /* Basic Info Form */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--navy-800);
    }

    .form-control {
      width: 100%;
      min-height: 48px;
      padding: 10px 12px;
      font-size: 1rem;
      font-family: inherit;
      color: var(--text-main);
      background: #ffffff;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-control:focus {
      border-color: var(--navy-700);
      box-shadow: 0 0 0 3px rgba(27, 64, 114, 0.15);
    }

    /* Shift Toggle */
    .shift-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .shift-btn {
      min-height: 48px;
      border: 1.5px solid var(--border-color);
      background: #ffffff;
      color: var(--text-muted);
      border-radius: var(--radius-md);
      font-size: 0.98rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .shift-btn.active {
      background: var(--navy-800);
      color: #ffffff;
      border-color: var(--navy-800);
      box-shadow: 0 2px 8px rgba(18, 45, 82, 0.25);
    }

    /* Category Tabs */
    .category-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }

    .category-tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      flex: 0 0 auto;
      min-height: 44px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--border-color);
      background: #ffffff;
      color: var(--text-muted);
      font-size: 0.88rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .tab-btn.active {
      background: var(--navy-900);
      color: #ffffff;
      border-color: var(--navy-900);
    }

    .tab-badge {
      font-size: 0.75rem;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(15, 39, 68, 0.08);
      color: inherit;
    }

    .tab-btn.active .tab-badge {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Category Accordion */
    .category-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .category-section.hidden-by-tab {
      display: none;
    }

    .category-header {
      width: 100%;
      background: var(--navy-50);
      border: none;
      border-bottom: 1px solid var(--border-color);
      padding: 15px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
    }

    .category-header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .category-code {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: var(--navy-800);
      color: #ffffff;
      font-weight: 800;
      font-size: 0.92rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .category-name {
      font-size: 1rem;
      font-weight: 800;
      color: var(--navy-900);
    }

    .category-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .cat-progress {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--navy-800);
    }

    .cat-progress.done {
      background: var(--pass-bg);
      border-color: var(--pass-border);
      color: var(--pass-color);
    }

    .chevron {
      transition: transform 0.2s ease;
      color: var(--navy-800);
    }

    .category-section.collapsed .chevron {
      transform: rotate(-90deg);
    }

    .category-section.collapsed .category-body {
      display: none;
    }

    .category-section.collapsed .category-header {
      border-bottom: none;
    }

    /* Checklist Item */
    .qa-item {
      padding: 16px;
      border-bottom: 1px solid #edf2f7;
      transition: background-color 0.15s ease;
    }

    .qa-item:last-child {
      border-bottom: none;
    }

    .qa-item.status-pass {
      background-color: #f7fef9;
    }

    .qa-item.status-fail {
      background-color: #fff8f8;
    }

    .qa-item-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }

    .qa-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 26px;
      height: 26px;
      padding: 0 6px;
      border-radius: 6px;
      background: var(--navy-100);
      color: var(--navy-800);
      font-size: 0.82rem;
      font-weight: 800;
      margin-top: 1px;
      flex-shrink: 0;
    }

    .qa-text {
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.45;
    }

    /* Large Touch Buttons */
    .qa-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .judge-btn {
      min-height: 52px;
      padding: 10px 8px;
      border-radius: var(--radius-md);
      border: 2px solid var(--border-color);
      background: #ffffff;
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.14s ease;
      user-select: none;
    }

    .judge-btn:active {
      transform: scale(0.98);
    }

    .judge-btn.pass.selected {
      background: var(--pass-color);
      border-color: var(--pass-color);
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(21, 128, 61, 0.28);
    }

    .judge-btn.fail.selected {
      background: var(--fail-color);
      border-color: var(--fail-color);
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(185, 28, 28, 0.28);
    }

    .judge-btn.na.selected {
      background: var(--na-color);
      border-color: var(--na-color);
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(71, 85, 105, 0.24);
    }

    /* Item Memo Box (always visible; highlighted on Fail) */
    .item-memo-box {
      margin-top: 10px;
    }

    .item-memo-title {
      display: none;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--fail-color);
      margin-bottom: 6px;
      align-items: center;
      gap: 6px;
    }

    .qa-item.status-fail .item-memo-box {
      padding: 12px;
      background: #ffffff;
      border: 1.5px solid var(--fail-border);
      border-radius: var(--radius-md);
      animation: slideDown 0.18s ease-out;
    }

    .qa-item.status-fail .item-memo-title {
      display: flex;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .item-memo {
      width: 100%;
      min-height: 44px;
      padding: 9px 12px;
      border: 1.5px solid #e2e8f0;
      border-radius: var(--radius-sm);
      font-family: inherit;
      font-size: 0.92rem;
      resize: vertical;
      outline: none;
      background: #f8fafc;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .item-memo:focus {
      background: #ffffff;
      border-color: var(--navy-700);
      box-shadow: 0 0 0 3px rgba(27, 64, 114, 0.12);
    }

    .qa-item.status-fail .item-memo {
      min-height: 78px;
      background: #ffffff;
    }

    .qa-item.status-fail .item-memo:focus {
      border-color: var(--fail-color);
      box-shadow: 0 0 0 3px rgba(185, 28, 28, 0.12);
    }

    .photo-section {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed #e2e8f0;
    }

    .photo-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .photo-btn {
      min-height: 44px;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--navy-700);
      background: var(--navy-50);
      color: var(--navy-800);
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .photo-btn.primary-cam {
      background: var(--navy-800);
      color: #ffffff;
      border-color: var(--navy-800);
    }

    .photo-btn:active {
      transform: scale(0.98);
    }

    .photo-count-tag {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-left: auto;
    }

    .hidden-file-input {
      display: none;
    }

    .photo-preview-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    .photo-thumb-wrap {
      position: relative;
      width: 92px;
      height: 92px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      background: #f8fafc;
    }

    .photo-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
    }

    .photo-remove-btn,
    .photo-save-btn {
      position: absolute;
      top: 4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: none;
      background: rgba(15, 23, 42, 0.78);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-remove-btn {
      right: 4px;
    }

    .photo-save-btn {
      left: 4px;
      background: rgba(27, 64, 114, 0.86);
    }

    /* Bottom Action Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border-color);
      padding: 10px 16px;
      box-shadow: 0 -4px 16px rgba(11, 31, 58, 0.08);
    }

    .bottom-bar-inner {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 0.9fr 1.3fr 1.4fr;
      gap: 8px;
    }

    .action-btn {
      min-height: 52px;
      padding: 0 10px;
      border-radius: var(--radius-md);
      border: none;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .action-btn:active {
      transform: scale(0.98);
    }

    .btn-reset {
      background: #ffffff;
      color: var(--fail-color);
      border: 1.5px solid var(--fail-border);
    }

    .btn-html-export {
      background: var(--navy-100);
      color: var(--navy-900);
      border: 1.5px solid var(--navy-700);
    }

    .btn-export {
      background: var(--navy-900);
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(11, 31, 58, 0.24);
    }

    /* Camera Modal */
    .camera-modal-box {
      width: 100%;
      max-width: 520px;
      background: #0f172a;
      color: #ffffff;
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
    }

    .camera-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .camera-modal-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
    }

    .camera-close-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .camera-video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000000;
      border-radius: var(--radius-md);
      overflow: hidden;
    }

    .camera-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .camera-controls {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .cam-ctrl-btn {
      min-height: 48px;
      padding: 10px 16px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    .cam-shutter-btn {
      flex: 1;
      min-height: 52px;
      border-radius: 999px;
      border: none;
      background: #22c55e;
      color: #ffffff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.4);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(11, 31, 58, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border-radius: var(--radius-lg);
      padding: 22px 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
    }

    .modal-title {
      margin: 0 0 8px;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--navy-900);
    }

    .modal-desc {
      margin: 0 0 18px;
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .modal-btn {
      min-height: 46px;
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      border: 1.5px solid var(--border-color);
      background: #ffffff;
      color: var(--text-main);
    }

    .modal-btn.danger {
      background: var(--fail-color);
      border-color: var(--fail-color);
      color: #ffffff;
    }

    /* Image Lightbox */
    .lightbox-img {
      max-width: 92vw;
      max-height: 84vh;
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: var(--navy-900);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 700;
      box-shadow: var(--shadow-md);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 120;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Responsive */
    @media (max-width: 640px) {
      .info-grid {
        grid-template-columns: 1fr;
      }

      .dash-grid {
        grid-template-columns: 1fr 1fr;
      }

      .dash-counts {
        grid-column: 1 / -1;
        justify-content: flex-start;
      }

      .judge-btn {
        min-height: 50px;
        font-size: 0.88rem;
        padding: 8px 4px;
      }

      .bottom-bar-inner {
        grid-template-columns: 0.75fr 1.15fr 1.15fr;
        gap: 6px;
      }

      .action-btn {
        font-size: 0.8rem;
        padding: 0 6px;
      }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-inner">
      <div class="brand-block">
        <div class="brand-badge" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4"></path>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">사료 제조 공장 QA 점검표</h1>
          <p class="brand-subtitle">현장 위생 및 공정 품질(HACCP/선행요건) 모바일 체크리스트</p>
        </div>
      </div>
      <div class="save-status" id="saveStatus">
        <span class="save-dot"></span>
        <span id="saveStatusText">자동 저장 대기중</span>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- 실시간 대시보드 -->
    <div class="dashboard-sticky">
      <div class="dashboard-card">
        <div class="dash-grid">
          <div class="dash-metric">
            <span class="dash-label">점검 진행률</span>
            <span class="dash-value" id="progressText">0/11 완료</span>
          </div>
          <div class="dash-metric">
            <span class="dash-label">적합률 (N/A 제외)</span>
            <span class="dash-value" id="passRateText">-%</span>
          </div>
          <div class="dash-counts">
            <span class="count-pill pass" id="countPass">적합 0</span>
            <span class="count-pill fail" id="countFail">부적합 0</span>
            <span class="count-pill na" id="countNa">N/A 0</span>
          </div>
        </div>
        <div class="progress-track" aria-label="점검 진행률 바">
          <div class="progress-fill" id="progressBar"></div>
        </div>
      </div>
    </div>

    <!-- 1. 기본 정보 입력 영역 -->
    <section class="card" aria-labelledby="basicInfoHeading">
      <h2 class="section-title" id="basicInfoHeading">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        1. 기본 정보 입력
      </h2>
      <div class="info-grid">
        <div class="form-group">
          <label class="form-label" for="inspectDate">점검 일자</label>
          <input type="date" id="inspectDate" class="form-control">
        </div>
        <div class="form-group">
          <label class="form-label" for="factoryLine">공장 / 라인 선택</label>
          <select id="factoryLine" class="form-control">
            <option value="1공장 배합라인">1공장 배합라인</option>
            <option value="2공장 펠렛라인">2공장 펠렛라인</option>
            <option value="원료 입고장">원료 입고장</option>
            <option value="제품 출하장">제품 출하장</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="inspectorName">점검자 이름</label>
          <input type="text" id="inspectorName" class="form-control" value="김현승" placeholder="점검자 성명을 입력하세요">
        </div>
        <div class="form-group">
          <span class="form-label">교대조 선택</span>
          <div class="shift-group" role="group" aria-label="교대조 선택">
            <button type="button" class="shift-btn active" data-shift="주간">☀ 주간</button>
            <button type="button" class="shift-btn" data-shift="야간">🌙 야간</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 카테고리 탭 -->
    <div class="category-tabs" role="tablist" aria-label="점검 카테고리 필터">
      <button type="button" class="tab-btn active" data-tab="all" role="tab" aria-selected="true">
        전체 보기 <span class="tab-badge" id="tabBadgeAll">0/11</span>
      </button>
      <button type="button" class="tab-btn" data-tab="A" role="tab" aria-selected="false">
        A. 원료 입고·보관 <span class="tab-badge" id="tabBadgeA">0/4</span>
      </button>
      <button type="button" class="tab-btn" data-tab="B" role="tab" aria-selected="false">
        B. 공정 관리 <span class="tab-badge" id="tabBadgeB">0/4</span>
      </button>
      <button type="button" class="tab-btn" data-tab="C" role="tab" aria-selected="false">
        C. 일반 위생·방충 <span class="tab-badge" id="tabBadgeC">0/3</span>
      </button>
    </div>

    <!-- 2. 점검 항목 영역 -->
    <div id="checklistContainer"></div>

    <!-- 3. 종합 메모 / 특이사항 -->
    <section class="card" aria-labelledby="overallMemoHeading">
      <h2 class="section-title" id="overallMemoHeading">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
        3. 종합 메모 / 특이사항
      </h2>
      <textarea id="overallMemo" class="item-memo" style="min-height: 92px; background: #ffffff;" placeholder="현장 전체 특이사항, 인수인계 내용, 후속 조치 요청 등을 자유롭게 입력하세요..."></textarea>
    </section>
  </main>

  <!-- 하단 고정 액션 바 -->
  <footer class="bottom-bar">
    <div class="bottom-bar-inner">
      <button type="button" class="action-btn btn-reset" id="resetBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
        초기화
      </button>
      <button type="button" class="action-btn btn-html-export" id="exportHtmlBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="12" y1="18" x2="12" y2="12"></line>
          <polyline points="9 15 12 18 15 15"></polyline>
        </svg>
        사진보고서
      </button>
      <button type="button" class="action-btn btn-export" id="exportCsvBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        엑셀(CSV)
      </button>
    </div>
  </footer>

  <!-- 실시간 카메라 촬영 모달 -->
  <div class="modal-backdrop" id="cameraModal" role="dialog" aria-modal="true" aria-labelledby="cameraModalTitle">
    <div class="camera-modal-box">
      <div class="camera-modal-header">
        <h3 class="camera-modal-title" id="cameraModalTitle">현장 사진 촬영</h3>
        <button type="button" class="camera-close-btn" id="closeCameraBtn" aria-label="카메라 닫기">×</button>
      </div>
      <div class="camera-video-wrap">
        <video id="cameraVideo" class="camera-video" autoplay playsinline muted></video>
      </div>
      <div class="camera-controls">
        <button type="button" class="cam-ctrl-btn" id="switchCameraBtn">전환</button>
        <button type="button" class="cam-shutter-btn" id="capturePhotoBtn">📸 촬영하여 첨부</button>
        <button type="button" class="cam-ctrl-btn" id="fallbackFileBtn">파일</button>
      </div>
    </div>
  </div>

  <!-- 초기화 확인 모달 -->
  <div class="modal-backdrop" id="resetModal" role="dialog" aria-modal="true" aria-labelledby="resetModalTitle">
    <div class="modal-box">
      <h3 class="modal-title" id="resetModalTitle">점검 내용을 초기화할까요?</h3>
      <p class="modal-desc">현재 작성 중인 모든 판정 결과, 부적합 메모, 첨부 사진 및 임시 저장 데이터가 삭제됩니다.</p>
      <div class="modal-actions">
        <button type="button" class="modal-btn" id="cancelResetBtn">취소</button>
        <button type="button" class="modal-btn danger" id="confirmResetBtn">모두 초기화</button>
      </div>
    </div>
  </div>

  <!-- 사진 확대 모달 -->
  <div class="modal-backdrop" id="lightboxModal" role="dialog" aria-modal="true" aria-label="첨부 사진 확대 보기">
    <img src="" alt="현장 사진 확대" class="lightbox-img" id="lightboxImg">
  </div>

  <!-- 알림 토스트 -->
  <div class="toast" id="toast"></div>

  <script>
    (function () {
      "use strict";

      const STORAGE_KEY = "feed_factory_qa_checklist_v1";

      const CATEGORIES = [
        {
          id: "A",
          title: "원료 입고 및 보관 (CCP/선행요건)",
          items: [
            { id: 1, text: "원료 입고 시 차량 위생 상태 및 방수포 덮개 이상 유무" },
            { id: 2, text: "주요 곡물 및 박류 곰팡이·해충·이물 혼입 육안 확인" },
            { id: 3, text: "사일로(Silo) 및 원료 빈(Bin) 상부 결로, 누수 및 청결 상태" },
            { id: 4, text: "알레르기 유발 물질 및 약제 첨가 원료의 구분 보관(라벨링) 준수" }
          ]
        },
        {
          id: "B",
          title: "배합·분쇄·펠렛 공정 관리",
          items: [
            { id: 5, text: "자석봉(Magnet) 및 체(Sieve) 이물 포집 상태 및 주기적 청소 기록 확인" },
            { id: 6, text: "펠렛 컨디셔너(Conditioner) 스팀 온도 및 체류 시간 기준치 준수 여부" },
            { id: 7, text: "쿨러(Cooler) 배출 제품 온도(외기 온도 +5℃ 이내) 및 수분 편차 확인" },
            { id: 8, text: "라인 전환 시 플러싱(Flushing) 실시 및 교차오염 방지 기록 확인" }
          ]
        },
        {
          id: "C",
          title: "작업장 일반 위생 및 방충·방서",
          items: [
            { id: 9, text: "작업장 바닥 분진 퇴적, 원료 낙하물 방치 및 배수로 청결 상태" },
            { id: 10, text: "포충등, 쥐덫 등 방충·방서 트랩 작동 상태 및 파손 여부" },
            { id: 11, text: "작업자 위생복, 안전모, 방진마스크 착용 및 손 소독 상태" }
          ]
        }
      ];

      const TOTAL_ITEMS = CATEGORIES.reduce((sum, cat) => sum + cat.items.length, 0);

      function getTodayLocal() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, "0");
        const d = String(now.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }

      function createDefaultState() {
        const results = {};
        CATEGORIES.forEach((cat) => {
          cat.items.forEach((item) => {
            results[item.id] = {
              status: "", // "", "pass", "fail", "na"
              memo: "",
              photos: [] // Array of compressed DataURL strings
            };
          });
        });

        return {
          basic: {
            date: getTodayLocal(),
            line: "1공장 배합라인",
            inspector: "김현승",
            shift: "주간"
          },
          activeTab: "all",
          collapsed: { A: false, B: false, C: false },
          overallMemo: "",
          results
        };
      }

      let state = loadState();

      function loadState() {
        const def = createDefaultState();
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return def;
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object") return def;

          const merged = {
            basic: Object.assign({}, def.basic, parsed.basic || {}),
            activeTab: parsed.activeTab || "all",
            collapsed: Object.assign({}, def.collapsed, parsed.collapsed || {}),
            overallMemo: parsed.overallMemo || "",
            results: Object.assign({}, def.results)
          };

          if (parsed.results) {
            Object.keys(def.results).forEach((id) => {
              if (parsed.results[id]) {
                merged.results[id] = {
                  status: parsed.results[id].status || "",
                  memo: parsed.results[id].memo || "",
                  photos: Array.isArray(parsed.results[id].photos) ? parsed.results[id].photos : []
                };
              }
            });
          }
          return merged;
        } catch (err) {
          return def;
        }
      }

      function saveState(showTime = true) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          if (showTime) {
            const now = new Date();
            const hh = String(now.getHours()).padStart(2, "0");
            const mm = String(now.getMinutes()).padStart(2, "0");
            const ss = String(now.getSeconds()).padStart(2, "0");
            document.getElementById("saveStatusText").textContent = `자동 저장됨 (${hh}:${mm}:${ss})`;
          }
        } catch (err) {
          showToast("저장 공간이 부족합니다. 사진 수를 줄여주세요.");
        }
      }

      function showToast(msg) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(() => {
          el.classList.remove("show");
        }, 2600);
      }

      // DOM Elements
      const inspectDateEl = document.getElementById("inspectDate");
      const factoryLineEl = document.getElementById("factoryLine");
      const inspectorNameEl = document.getElementById("inspectorName");
      const overallMemoEl = document.getElementById("overallMemo");
      const shiftBtns = document.querySelectorAll(".shift-btn");
      const tabBtns = document.querySelectorAll(".tab-btn");
      const checklistContainer = document.getElementById("checklistContainer");

      function syncBasicInputs() {
        inspectDateEl.value = state.basic.date || getTodayLocal();
        factoryLineEl.value = state.basic.line || "1공장 배합라인";
        inspectorNameEl.value = state.basic.inspector !== undefined ? state.basic.inspector : "김현승";
        overallMemoEl.value = state.overallMemo || "";

        shiftBtns.forEach((btn) => {
          btn.classList.toggle("active", btn.dataset.shift === state.basic.shift);
        });
      }

      function bindBasicInputs() {
        inspectDateEl.addEventListener("change", (e) => {
          state.basic.date = e.target.value;
          saveState();
        });

        factoryLineEl.addEventListener("change", (e) => {
          state.basic.line = e.target.value;
          saveState();
        });

        inspectorNameEl.addEventListener("input", (e) => {
          state.basic.inspector = e.target.value;
          saveState();
        });

        overallMemoEl.addEventListener("input", (e) => {
          state.overallMemo = e.target.value;
          saveState();
        });

        shiftBtns.forEach((btn) => {
          btn.addEventListener("click", () => {
            state.basic.shift = btn.dataset.shift;
            syncBasicInputs();
            saveState();
          });
        });
      }

      function renderChecklist() {
        checklistContainer.innerHTML = "";

        CATEGORIES.forEach((cat) => {
          const section = document.createElement("section");
          section.className = "category-section";
          section.dataset.category = cat.id;

          if (state.collapsed[cat.id]) {
            section.classList.add("collapsed");
          }
          if (state.activeTab !== "all" && state.activeTab !== cat.id) {
            section.classList.add("hidden-by-tab");
          }

          // Category Header
          const headerBtn = document.createElement("button");
          headerBtn.type = "button";
          headerBtn.className = "category-header";
          headerBtn.innerHTML = `
            <div class="category-header-left">
              <span class="category-code">${cat.id}</span>
              <span class="category-name">${cat.title}</span>
            </div>
            <div class="category-meta">
              <span class="cat-progress" id="catProgress_${cat.id}">0/${cat.items.length}</span>
              <svg class="chevron" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </div>
          `;

          headerBtn.addEventListener("click", () => {
            state.collapsed[cat.id] = !state.collapsed[cat.id];
            section.classList.toggle("collapsed", state.collapsed[cat.id]);
            saveState(false);
          });

          const body = document.createElement("div");
          body.className = "category-body";

          cat.items.forEach((item) => {
            const res = state.results[item.id];
            const itemDiv = document.createElement("div");
            itemDiv.className = "qa-item";
            itemDiv.id = `qaItem_${item.id}`;
            if (res.status) {
              itemDiv.classList.add(`status-${res.status}`);
            }

            itemDiv.innerHTML = `
              <div class="qa-item-header">
                <span class="qa-num">${item.id}</span>
                <div class="qa-text">${item.text}</div>
              </div>
              <div class="qa-actions" role="group" aria-label="항목 ${item.id} 판정">
                <button type="button" class="judge-btn pass ${res.status === "pass" ? "selected" : ""}" data-id="${item.id}" data-status="pass">
                  ✓ 적합
                </button>
                <button type="button" class="judge-btn fail ${res.status === "fail" ? "selected" : ""}" data-id="${item.id}" data-status="fail">
                  ✕ 부적합
                </button>
                <button type="button" class="judge-btn na ${res.status === "na" ? "selected" : ""}" data-id="${item.id}" data-status="na">
                  — 해당없음
                </button>
              </div>
              <div class="item-memo-box">
                <div class="item-memo-title">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                  </svg>
                  부적합 상세 내용 메모
                </div>
                <textarea class="item-memo" data-id="${item.id}" placeholder="간단한 메모 또는 특이사항을 입력하세요..."></textarea>
              </div>
              <div class="photo-section">
                <div class="photo-controls">
                  <button type="button" class="photo-btn primary-cam" data-action="camera" data-id="${item.id}">
                    📷 사진 찍기
                  </button>
                  <button type="button" class="photo-btn" data-action="gallery" data-id="${item.id}">
                    🖼 사진 업로드
                  </button>
                  <span class="photo-count-tag" id="photoCountTag_${item.id}"></span>
                  <input type="file" accept="image/*" capture="environment" class="hidden-file-input" id="cameraInput_${item.id}">
                  <input type="file" accept="image/*" multiple class="hidden-file-input" id="galleryInput_${item.id}">
                </div>
                <div class="photo-preview-list" id="photoList_${item.id}"></div>
              </div>
            `;

            const memoEl = itemDiv.querySelector(".item-memo");
            memoEl.value = res.memo || "";
            memoEl.addEventListener("input", (e) => {
              state.results[item.id].memo = e.target.value;
              saveState();
            });

            // Judge button handlers
            itemDiv.querySelectorAll(".judge-btn").forEach((btn) => {
              btn.addEventListener("click", () => {
                const clickedStatus = btn.dataset.status;
                const currentStatus = state.results[item.id].status;
                const nextStatus = currentStatus === clickedStatus ? "" : clickedStatus;

                state.results[item.id].status = nextStatus;

                itemDiv.classList.remove("status-pass", "status-fail", "status-na");
                if (nextStatus) {
                  itemDiv.classList.add(`status-${nextStatus}`);
                }

                itemDiv.querySelectorAll(".judge-btn").forEach((b) => {
                  b.classList.toggle("selected", b.dataset.status === nextStatus);
                });

                updateDashboard();
                saveState();
              });
            });

            // Photo buttons
            const cameraInput = itemDiv.querySelector(`#cameraInput_${item.id}`);
            const galleryInput = itemDiv.querySelector(`#galleryInput_${item.id}`);

            itemDiv.querySelector('[data-action="camera"]').addEventListener("click", () => {
              openCameraModal(item.id, cameraInput);
            });
            itemDiv.querySelector('[data-action="gallery"]').addEventListener("click", () => {
              galleryInput.click();
            });

            cameraInput.addEventListener("change", (e) => handleFiles(item.id, e.target.files, cameraInput));
            galleryInput.addEventListener("change", (e) => handleFiles(item.id, e.target.files, galleryInput));

            body.appendChild(itemDiv);
            renderPhotoList(item.id, itemDiv.querySelector(`#photoList_${item.id}`), itemDiv.querySelector(`#photoCountTag_${item.id}`));
          });

          section.appendChild(headerBtn);
          section.appendChild(body);
          checklistContainer.appendChild(section);
        });

        applyActiveTab();
        updateDashboard();
      }

      function renderPhotoList(itemId, containerEl, countTagEl) {
        const listEl = containerEl || document.getElementById(`photoList_${itemId}`);
        const tagEl = countTagEl || document.getElementById(`photoCountTag_${itemId}`);
        if (!listEl) return;
        listEl.innerHTML = "";

        const photos = state.results[itemId].photos || [];
        if (tagEl) {
          tagEl.textContent = photos.length > 0 ? `첨부 ${photos.length}장` : "";
        }

        photos.forEach((dataUrl, idx) => {
          const wrap = document.createElement("div");
          wrap.className = "photo-thumb-wrap";

          const img = document.createElement("img");
          img.className = "photo-thumb";
          img.src = dataUrl;
          img.alt = `항목 ${itemId} 첨부 사진 ${idx + 1}`;
          img.addEventListener("click", () => openLightbox(dataUrl));

          const saveBtn = document.createElement("button");
          saveBtn.type = "button";
          saveBtn.className = "photo-save-btn";
          saveBtn.textContent = "⬇";
          saveBtn.title = "사진 저장";
          saveBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            const a = document.createElement("a");
            a.href = dataUrl;
            a.download = `QA_항목${itemId}_사진${idx + 1}_${state.basic.date || getTodayLocal()}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
          });

          const rmBtn = document.createElement("button");
          rmBtn.type = "button";
          rmBtn.className = "photo-remove-btn";
          rmBtn.textContent = "×";
          rmBtn.title = "사진 삭제";
          rmBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            state.results[itemId].photos.splice(idx, 1);
            renderPhotoList(itemId);
            saveState();
          });

          wrap.appendChild(img);
          wrap.appendChild(saveBtn);
          wrap.appendChild(rmBtn);
          listEl.appendChild(wrap);
        });
      }

      function compressImage(file, maxDim = 900, quality = 0.72) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (ev) => {
            const img = new Image();
            img.onload = () => {
              let w = img.width;
              let h = img.height;
              if (w > maxDim || h > maxDim) {
                if (w >= h) {
                  h = Math.round((h * maxDim) / w);
                  w = maxDim;
                } else {
                  w = Math.round((w * maxDim) / h);
                  h = maxDim;
                }
              }
              const canvas = document.createElement("canvas");
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext("2d");
              ctx.drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL("image/jpeg", quality));
            };
            img.onerror = reject;
            img.src = ev.target.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      async function handleFiles(itemId, fileList, inputEl) {
        if (!fileList || fileList.length === 0) return;
        for (const file of Array.from(fileList)) {
          if (!file.type.startsWith("image/")) continue;
          try {
            const compressed = await compressImage(file);
            state.results[itemId].photos.push(compressed);
          } catch (err) {
            showToast("이미지를 불러오는 중 오류가 발생했습니다.");
          }
        }
        inputEl.value = "";
        renderPhotoList(itemId);
        saveState();
      }

      function updateDashboard() {
        let passCount = 0;
        let failCount = 0;
        let naCount = 0;

        CATEGORIES.forEach((cat) => {
          let catDone = 0;
          cat.items.forEach((item) => {
            const st = state.results[item.id].status;
            if (st) {
              catDone++;
              if (st === "pass") passCount++;
              else if (st === "fail") failCount++;
              else if (st === "na") naCount++;
            }
          });

          const catBadge = document.getElementById(`catProgress_${cat.id}`);
          if (catBadge) {
            catBadge.textContent = `${catDone}/${cat.items.length}`;
            catBadge.classList.toggle("done", catDone === cat.items.length);
          }

          const tabBadge = document.getElementById(`tabBadge${cat.id}`);
          if (tabBadge) {
            tabBadge.textContent = `${catDone}/${cat.items.length}`;
          }
        });

        const totalDone = passCount + failCount + naCount;
        const pctDone = Math.round((totalDone / TOTAL_ITEMS) * 100);

        document.getElementById("progressText").textContent = `${totalDone}/${TOTAL_ITEMS} 완료`;
        document.getElementById("progressBar").style.width = `${pctDone}%`;
        document.getElementById("tabBadgeAll").textContent = `${totalDone}/${TOTAL_ITEMS}`;

        document.getElementById("countPass").textContent = `적합 ${passCount}`;
        document.getElementById("countFail").textContent = `부적합 ${failCount}`;
        document.getElementById("countNa").textContent = `N/A ${naCount}`;

        const passRateEl = document.getElementById("passRateText");
        const denom = passCount + failCount;
        passRateEl.classList.remove("pass-rate-good", "pass-rate-warn", "pass-rate-bad");

        if (denom === 0) {
          passRateEl.textContent = "-%";
        } else {
          const rate = Math.round((passCount / denom) * 100);
          passRateEl.textContent = `${rate}%`;
          if (rate >= 90) passRateEl.classList.add("pass-rate-good");
          else if (rate >= 70) passRateEl.classList.add("pass-rate-warn");
          else passRateEl.classList.add("pass-rate-bad");
        }
      }

      // Tabs
      function applyActiveTab() {
        tabBtns.forEach((btn) => {
          const isActive = btn.dataset.tab === state.activeTab;
          btn.classList.toggle("active", isActive);
          btn.setAttribute("aria-selected", String(isActive));
        });

        document.querySelectorAll(".category-section").forEach((sec) => {
          const show = state.activeTab === "all" || sec.dataset.category === state.activeTab;
          sec.classList.toggle("hidden-by-tab", !show);
        });
      }

      tabBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          state.activeTab = btn.dataset.tab;
          if (state.activeTab !== "all") {
            state.collapsed[state.activeTab] = false;
            const sec = document.querySelector(`.category-section[data-category="${state.activeTab}"]`);
            if (sec) sec.classList.remove("collapsed");
          }
          applyActiveTab();
          saveState(false);
        });
      });

      // CSV Export (UTF-8 BOM)
      function csvEscape(val) {
        const str = String(val == null ? "" : val);
        return `"${str.replace(/"/g, '""')}"`;
      }

      function statusLabel(st) {
        if (st === "pass") return "적합(Pass)";
        if (st === "fail") return "부적합(Fail)";
        if (st === "na") return "해당없음(N/A)";
        return "미점검";
      }

      document.getElementById("exportCsvBtn").addEventListener("click", () => {
        let passCount = 0;
        let failCount = 0;
        let naCount = 0;
        Object.values(state.results).forEach((r) => {
          if (r.status === "pass") passCount++;
          else if (r.status === "fail") failCount++;
          else if (r.status === "na") naCount++;
        });
        const totalDone = passCount + failCount + naCount;
        const denom = passCount + failCount;
        const passRate = denom === 0 ? "-" : `${Math.round((passCount / denom) * 100)}%`;

        const rows = [];
        rows.push(["사료 제조 공장 현장 위생 및 공정 품질(QA) 점검 결과"]);
        rows.push(["점검 일자", state.basic.date || "", "공장/라인", state.basic.line || ""]);
        rows.push(["점검자", state.basic.inspector || "", "교대조", state.basic.shift || ""]);
        rows.push(["진행률", `${totalDone}/${TOTAL_ITEMS}`, "적합률", passRate]);
        rows.push(["적합", passCount, "부적합", failCount, "해당없음", naCount]);
        rows.push([]);
        rows.push(["카테고리", "번호", "점검 항목", "판정 결과", "메모 / 특이사항", "첨부 사진 수"]);

        CATEGORIES.forEach((cat) => {
          cat.items.forEach((item) => {
            const res = state.results[item.id];
            rows.push([
              `${cat.id}. ${cat.title}`,
              item.id,
              item.text,
              statusLabel(res.status),
              res.memo || "",
              res.photos ? res.photos.length : 0
            ]);
          });
        });

        if (state.overallMemo && state.overallMemo.trim()) {
          rows.push([]);
          rows.push(["종합 메모 / 특이사항", state.overallMemo.trim()]);
        }

        const csvContent = "\uFEFF" + rows.map((row) => row.map(csvEscape).join(",")).join("\r\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);

        const safeLine = (state.basic.line || "공장").replace(/\s+/g, "");
        const dateStr = state.basic.date || getTodayLocal();
        const fileName = `QA점검표_${dateStr}_${safeLine}.csv`;

        const a = document.createElement("a");
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        showToast("CSV 파일이 다운로드되었습니다.");
      });

      // Photo-Embedded HTML Report Export
      function escapeHtml(str) {
        return String(str == null ? "" : str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      document.getElementById("exportHtmlBtn").addEventListener("click", () => {
        let passCount = 0;
        let failCount = 0;
        let naCount = 0;
        Object.values(state.results).forEach((r) => {
          if (r.status === "pass") passCount++;
          else if (r.status === "fail") failCount++;
          else if (r.status === "na") naCount++;
        });
        const totalDone = passCount + failCount + naCount;
        const denom = passCount + failCount;
        const passRate = denom === 0 ? "-" : `${Math.round((passCount / denom) * 100)}%`;

        let sectionsHtml = "";
        CATEGORIES.forEach((cat) => {
          let rowsHtml = "";
          cat.items.forEach((item) => {
            const res = state.results[item.id];
            const photosHtml = (res.photos || []).length
              ? `<div class="photos">${res.photos.map((src, i) => `<img src="${src}" alt="항목 ${item.id} 사진 ${i + 1}">`).join("")}</div>`
              : "";
            const memoHtml = res.memo
              ? `<div class="memo ${res.status === "fail" ? "fail" : ""}"><strong>${res.status === "fail" ? "부적합 메모:" : "메모:"}</strong> ${escapeHtml(res.memo)}</div>`
              : "";
            const badgeClass = res.status || "none";
            rowsHtml += `
              <div class="item">
                <div class="item-top">
                  <span class="num">${item.id}</span>
                  <span class="txt">${escapeHtml(item.text)}</span>
                  <span class="badge ${badgeClass}">${statusLabel(res.status)}</span>
                </div>
                ${memoHtml}
                ${photosHtml}
              </div>`;
          });
          sectionsHtml += `<h2>${escapeHtml(cat.id + ". " + cat.title)}</h2>${rowsHtml}`;
        });

        const reportHtml = `<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>QA 점검 사진보고서</title><style>
body{font-family:"Malgun Gothic",sans-serif;max-width:900px;margin:24px auto;padding:0 16px;color:#182433;background:#f8fafc}
h1{color:#0b1f3a;margin-bottom:8px}
.meta{background:#fff;border:1px solid #d7e0ea;border-radius:10px;padding:14px;margin-bottom:18px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;font-size:14px}
h2{color:#122d52;border-bottom:2px solid #cbd5e1;padding-bottom:6px;margin-top:22px}
.item{background:#fff;border:1px solid #d7e0ea;border-radius:10px;padding:12px;margin-bottom:10px}
.item-top{display:flex;align-items:center;gap:10px}
.num{background:#e8eef6;color:#122d52;font-weight:700;padding:2px 8px;border-radius:6px;font-size:13px}
.txt{flex:1;font-weight:600}
.badge{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.badge.pass{background:#dcfce7;color:#15803d}
.badge.fail{background:#fee2e2;color:#b91c1c}
.badge.na{background:#e2e8f0;color:#475569}
.badge.none{background:#f1f5f9;color:#64748b}
.memo{margin-top:8px;padding:8px 10px;background:#f1f5f9;border-left:3px solid #1b4072;font-size:13px;white-space:pre-wrap}
.memo.fail{background:#fff5f5;border-left-color:#b91c1c}
.overall{background:#fff;border:1px solid #d7e0ea;border-radius:10px;padding:14px;margin-top:16px;font-size:14px;white-space:pre-wrap}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.photos img{width:180px;height:180px;object-fit:cover;border-radius:8px;border:1px solid #cbd5e1}
</style></head><body>
<h1>사료 제조 공장 QA 점검 보고서</h1>
<div class="meta">
  <div><strong>점검 일자:</strong> ${escapeHtml(state.basic.date)}</div>
  <div><strong>공장 / 라인:</strong> ${escapeHtml(state.basic.line)}</div>
  <div><strong>점검자:</strong> ${escapeHtml(state.basic.inspector)}</div>
  <div><strong>교대조:</strong> ${escapeHtml(state.basic.shift)}</div>
  <div><strong>진행률:</strong> ${totalDone}/${TOTAL_ITEMS}</div>
  <div><strong>적합률:</strong> ${passRate} (적합 ${passCount} / 부적합 ${failCount} / N/A ${naCount})</div>
</div>
${sectionsHtml}
${state.overallMemo && state.overallMemo.trim() ? `<h2>종합 메모 / 특이사항</h2><div class="overall">${escapeHtml(state.overallMemo.trim())}</div>` : ""}
</body></html>`;

        const blob = new Blob([reportHtml], { type: "text/html;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const safeLine = (state.basic.line || "공장").replace(/\s+/g, "");
        const dateStr = state.basic.date || getTodayLocal();
        const a = document.createElement("a");
        a.href = url;
        a.download = `QA사진보고서_${dateStr}_${safeLine}.html`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast("사진 포함 보고서(HTML)가 저장되었습니다.");
      });

      // Live Camera Modal (WebRTC + file fallback)
      const cameraModal = document.getElementById("cameraModal");
      const cameraVideo = document.getElementById("cameraVideo");
      let activeCameraStream = null;
      let activeCameraItemId = null;
      let activeCameraFallbackInput = null;
      let currentFacingMode = "environment";

      function stopCameraStream() {
        if (activeCameraStream) {
          activeCameraStream.getTracks().forEach((t) => t.stop());
          activeCameraStream = null;
        }
        cameraVideo.srcObject = null;
      }

      function closeCameraModal() {
        stopCameraStream();
        cameraModal.classList.remove("open");
        activeCameraItemId = null;
        activeCameraFallbackInput = null;
      }

      async function startCameraStream() {
        stopCameraStream();
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: currentFacingMode } },
          audio: false
        });
        activeCameraStream = stream;
        cameraVideo.srcObject = stream;
      }

      async function openCameraModal(itemId, fallbackInput) {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          fallbackInput.click();
          return;
        }
        activeCameraItemId = itemId;
        activeCameraFallbackInput = fallbackInput;
        try {
          await startCameraStream();
          cameraModal.classList.add("open");
        } catch (err) {
          closeCameraModal();
          fallbackInput.click();
        }
      }

      document.getElementById("closeCameraBtn").addEventListener("click", closeCameraModal);
      cameraModal.addEventListener("click", (e) => {
        if (e.target === cameraModal) closeCameraModal();
      });

      document.getElementById("switchCameraBtn").addEventListener("click", async () => {
        currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
        try {
          await startCameraStream();
        } catch (err) {
          showToast("카메라 전환에 실패했습니다.");
        }
      });

      document.getElementById("fallbackFileBtn").addEventListener("click", () => {
        const input = activeCameraFallbackInput;
        closeCameraModal();
        if (input) input.click();
      });

      document.getElementById("capturePhotoBtn").addEventListener("click", () => {
        if (!activeCameraItemId || !cameraVideo.videoWidth) return;
        const maxDim = 900;
        let w = cameraVideo.videoWidth;
        let h = cameraVideo.videoHeight;
        if (w > maxDim || h > maxDim) {
          if (w >= h) {
            h = Math.round((h * maxDim) / w);
            w = maxDim;
          } else {
            w = Math.round((w * maxDim) / h);
            h = maxDim;
          }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(cameraVideo, 0, 0, w, h);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.72);

        const targetId = activeCameraItemId;
        state.results[targetId].photos.push(dataUrl);
        renderPhotoList(targetId);
        saveState();
        closeCameraModal();
        showToast("사진이 촬영되어 첨부되었습니다.");
      });

      // Reset Modal
      const resetModal = document.getElementById("resetModal");
      document.getElementById("resetBtn").addEventListener("click", () => {
        resetModal.classList.add("open");
      });
      document.getElementById("cancelResetBtn").addEventListener("click", () => {
        resetModal.classList.remove("open");
      });
      resetModal.addEventListener("click", (e) => {
        if (e.target === resetModal) resetModal.classList.remove("open");
      });
      document.getElementById("confirmResetBtn").addEventListener("click", () => {
        localStorage.removeItem(STORAGE_KEY);
        state = createDefaultState();
        syncBasicInputs();
        renderChecklist();
        saveState(false);
        document.getElementById("saveStatusText").textContent = "초기화 완료";
        resetModal.classList.remove("open");
        showToast("모든 점검 내용이 초기화되었습니다.");
      });

      // Lightbox Modal
      const lightboxModal = document.getElementById("lightboxModal");
      const lightboxImg = document.getElementById("lightboxImg");
      function openLightbox(src) {
        lightboxImg.src = src;
        lightboxModal.classList.add("open");
      }
      lightboxModal.addEventListener("click", () => {
        lightboxModal.classList.remove("open");
        lightboxImg.src = "";
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          resetModal.classList.remove("open");
          lightboxModal.classList.remove("open");
          closeCameraModal();
        }
      });

      // Initialize App
      syncBasicInputs();
      bindBasicInputs();
      renderChecklist();

      if (localStorage.getItem(STORAGE_KEY)) {
        document.getElementById("saveStatusText").textContent = "임시 저장 불러옴";
      }
    })();
  </script>
</body>
</html>
